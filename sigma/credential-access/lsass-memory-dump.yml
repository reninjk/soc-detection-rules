title: LSASS Memory Access via Suspicious Process
id: a7f4e2d1-9b3c-4f8a-b6e5-2c1d0a9f8e7d
status: test
description: >
  Detects suspicious processes accessing the LSASS process memory,
  a technique commonly used for credential dumping (T1003.001).
  Legitimate access is highly restricted; any unexpected source process
  should be treated as high-priority and investigated immediately.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://docs.microsoft.com/en-us/windows/win32/api/minidumpapiset/nf-minidumpapiset-minidumpwritedump
author: reninjk
date: 2026/10/25
modified: 2026/10/25
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1010'
      - '0x1038'
      - '0x40'
      - '0x1400'
      - '0x1fffff'
  filter_legitimate:
    SourceImage|endswith:
      - '\MsMpEng.exe'
      - '\csrss.exe'
      - '\werfault.exe'
      - '\WerFaultSecure.exe'
      - '\taskmgr.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - AV/EDR products performing routine memory scanning (tune per environment baseline)
  - Windows Error Reporting (covered by filter_legitimate)
  - Legitimate security tooling used by the team (add to filter_legitimate after review)
level: high
response:
  - Isolate the host and preserve volatile memory before any remediation
  - Investigate source process hash, parent, command line, and code signature
  - Hunt for lateral movement originating from this host in the prior 24 hours
  - Escalate to IR team if credential access is confirmed
